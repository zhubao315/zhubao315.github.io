name: External link check (diagnostic)

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Diagnostic only: a 404 is reported but must not block a Pages deploy.
      - name: Check external links
        continue-on-error: true
        run: npm run test:links:external

      - name: Upload external link report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-link-report
          path: |
            docs/link-report.json
            docs/link-history.jsonl
          retention-days: 14
